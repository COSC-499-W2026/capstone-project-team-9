services:
  backend:
    build:
      context: ./app/backend
    ports:
      - "8000:8000"
    volumes:
      - ./app/backend/src:/app/src
      - ./app/backend/scripts:/app/scripts
      - ./tests/backend:/app/tests/backend
    environment:
      ENV: ${ENV}
      RUNNING_IN_DOCKER: true
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FRONTEND_URL: https://frontend:5173
      AUTH_TOKEN_SECRET: "${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env to a random value of at least 32 characters}"
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: true  # prevents __pycache__ being written to bind-mounted folders

  frontend:
    build:
      context: ./app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./app/frontend/src:/app/src
      - ./tests/frontend:/app/tests/frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"  # Allows you to inspect the DB locally via pgAdmin/DBeaver if you want
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: