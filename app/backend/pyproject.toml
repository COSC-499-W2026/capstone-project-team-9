[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-project-team-9"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "sqlmodel>=0.0.48",
    "psycopg[binary]>=3.3.6", # Python adapter for Postgres; doesn't come installed with sqlmodel by default
    "easyocr>=1.7.2",
    "opencv-python-headless>=4.10.0.84",
    "numpy>=1.26.4",
    "bcrypt>=4.0.0",
    "PyJWT>2.10",
    "jose",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/backend"] # this path may look incorrect, but it is correct inside the Docker container!
pythonpath = ["src"]
addopts = "-v --cov=src --cov-report=term-missing:skip-covered"