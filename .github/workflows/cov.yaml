name: Coverage Report

on:
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start containers
        run: docker compose up -d --build

      - name: Build coverage report
        shell: bash
        run: |
          docker compose exec -T backend pytest --junitxml=pytest.xml | tee pytest-coverage.txt

      - name: Write coverage summary
        if: always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          docker compose exec -T backend coverage report -m --format=markdown >> $GITHUB_STEP_SUMMARY